# ---------- 基础 ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -g mouse on
set -g xterm-keys on
set -g set-clipboard on

unbind -n WheelUpPane
unbind -n WheelDownPane

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set -g history-limit 100000
set -g focus-events on

# 更快响应
set -sg escape-time 0

# ---------- 前缀键 ----------
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# ---------- 分屏 ----------
bind | split-window -h
bind - split-window -v


# 使用 vim 键位移动
bind j select-pane -D
bind h select-pane -L
bind k select-pane -U
bind l select-pane -R

# 调整 pane 大小
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# ---------- 窗口 ----------
set -g base-index 1
set -g pane-base-index 1
bind c new-window
bind n next-window
bind p previous-window
# bind x kill-pane
# bind & kill-window

# Use Alt + number to switch windows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------- 复制模式 ----------
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle


# ---------- 状态栏 ----------
set -g status-position bottom
set -g status-interval 1
# ===== 基础状态栏 =====
set -g status-style bg=#ebdbb2,fg=#3c3836
# ===== 左侧（session）=====
set -g status-left-length 40
set -g status-left "#[fg=#fbf1c7,bg=#d79921,bold] #S #[fg=#d79921,bg=#f2e5bc,nobold]"
# ===== 右侧（时间）=====
set -g status-right-length 50
set -g status-right "#[fg=#fbf1c7,bg=#458588] %Y-%m-%d %H:%M #[fg=#458588,bg=#f2e5bc]"
# ===== 窗口标签 =====
# 普通窗口
set -g window-status-format "#[fg=#7c6f64,bg=#ebdbb2] #I:#W #[default]"
# 当前窗口
set -g window-status-current-format "#[fg=#fbf1c7,bg=#b16286,bold] #I:#W #[fg=#b16286,bg=#f2e5bc,nobold]"
# ===== 分隔线 =====
set -g window-status-separator ""
# ===== Pane 边框 =====
set -g pane-border-style fg=#d5c4a1
set -g pane-active-border-style fg=#b16286
set -g pane-border-status off
# ===== 消息提示 =====
set -g message-style bg=#ebdbb2,fg=#3c3836
# ===== 命令行 =====
set -g message-command-style bg=#d79921,fg=#fbf1c7

# ---------- SSH / 单底部状态栏策略 ----------
# 设计目标：只允许一个“底部状态栏 owner”。
# - 本地 shell/build/git：本地 tmux 底栏显示。
# - 本地 vim/nvim/lualine：本地 tmux 底栏隐藏，让编辑器底栏成为唯一底栏。
# - 任意 ssh/mosh：本地 tmux 底栏一律隐藏；顶部只显示轻量 ssh 边界信息。
#
# 取舍：不再区分“普通 ssh shell”和“ssh + 远端 tmux/vim”。这样远程窗口内部不会因为
# 远端 shell/tmux/vim 状态变化而反复切换本地 status，闪烁和启发式误判都会更少。
# 约束：单文件配置；不要求远程端安装脚本、改配置或设置环境变量。
# 顶部 SSH 标识：仅在 ssh/mosh pane 开启，作为边界提示，不作为第二状态栏。
set -g pane-border-format '#[fg=#928374]ssh #[nobold,fg=#928374] #{session_name}:#{window_index}.#{pane_index}#[default]'
set -g pane-border-status off

# 单文件内联状态机：tmux 将该 option 作为 shell 脚本执行；没有外部脚本文件，也不依赖远端配置。
set -g @local_status_controller 'T="$(command -v tmux || { [ -x /opt/homebrew/bin/tmux ] && printf %s /opt/homebrew/bin/tmux; } || { [ -x /usr/local/bin/tmux ] && printf %s /usr/local/bin/tmux; } || { [ -x /usr/bin/tmux ] && printf %s /usr/bin/tmux; })"
[ -n "$T" ] || exit 0
pane="$($T display-message -p '\''#{pane_id}'\'' 2>/dev/null || true)"
[ -n "$pane" ] || exit 0
cmd="$($T display-message -p -t "$pane" '\''#{pane_current_command}'\'' 2>/dev/null || true)"
tty="$($T display-message -p -t "$pane" '\''#{pane_tty}'\'' 2>/dev/null || true)"
# pane_current_command returns to the local shell after ssh/mosh exits.  Keep
# this flag on the pane (rather than globally) so a focus change is not treated
# as an SSH disconnect.
was_ssh="$($T show-options -p -qv -t "$pane" @local_ssh_was_active 2>/dev/null || printf 0)"

is_ssh=0
case "$cmd" in ssh|mosh) is_ssh=1;; esac
label="ssh"

if [ "$is_ssh" = 1 ]; then
  # macOS: pane_title 经常是本机名；从当前 tty 的 ssh/mosh 命令拿真实目标。
  if [ -n "$tty" ]; then
    tty_name=${tty#/dev/}
    ssh_cmd="$(ps -t "$tty_name" -o command= 2>/dev/null | awk '\''/(^|[[:space:]\/])(ssh|mosh)([[:space:]]|$)/ {print; exit}'\'' || true)"
    if [ -n "$ssh_cmd" ]; then
      dest="$(printf '\''%s\n'\'' "$ssh_cmd" | awk '\''
        {
          start=1
          for(i=1;i<=NF;i++){
            if($i ~ /(^|\/)(ssh|mosh)$/){ start=i+1; break }
          }
          for(i=start;i<=NF;i++){
            if($i ~ /^-/){
              if($i ~ /^-[bcDEeFIiJLlmOoQRSWw]$/) i++
              continue
            }
            print $i
            exit
          }
        }
      '\'')"
      case "$dest" in ssh|mosh|autossh|'\'''\'') label="$cmd";; *) label="$cmd $dest";; esac
    else
      label="$cmd"
    fi
  fi
fi

# SSH can disappear without emitting the remote tmux cleanup sequences (for
# example after a network loss).  On this pane-local ssh/mosh -> shell edge,
# reset the client's terminal modes once: alternate screen, mouse reporting,
# keypad mode and focus reporting can otherwise leak into the local shell.
if [ "$is_ssh" = 1 ]; then
  $T set-option -p -q -t "$pane" @local_ssh_was_active 1 2>/dev/null || true
elif [ "$was_ssh" = 1 ]; then
  $T send-keys -R -t "$pane" 2>/dev/null || true
  $T set-option -p -q -t "$pane" @local_ssh_was_active 0 2>/dev/null || true
fi

if [ "$is_ssh" = 1 ]; then
  $T set-window-option -q -t "$pane" pane-border-status top 2>/dev/null || true
  $T set-window-option -q -t "$pane" pane-border-format "#[fg=#928374]$label #[nobold,fg=#928374] #{session_name}:#{window_index}.#{pane_index}#[default]" 2>/dev/null || true
else
  $T set-window-option -q -t "$pane" pane-border-status off 2>/dev/null || true
fi

hide=0
case "$cmd" in nvim|vim) hide=1;; esac
nvim_flag="$($T show -gv @nvim_lualine 2>/dev/null || true)"
[ "$nvim_flag" = 1 ] && hide=1
# 新策略：只要当前 pane 是 ssh/mosh，本地底部 status 一律隐藏。
[ "$is_ssh" = 1 ] && hide=1

if [ "$hide" = 1 ]; then
  $T set-option -q status off 2>/dev/null || true
else
  $T set-option -q status on 2>/dev/null || true
fi
'

set-hook -g client-attached 'run-shell -b "#{@local_status_controller}"'
set-hook -g client-session-changed 'run-shell -b "#{@local_status_controller}"'
set-hook -g pane-focus-in 'run-shell -b "#{@local_status_controller}"'
set-hook -g pane-focus-out 'run-shell -b "#{@local_status_controller}"'
set-hook -g pane-title-changed 'run-shell -b "#{@local_status_controller}"'
set-hook -g window-pane-changed 'run-shell -b "#{@local_status_controller}"'
set-hook -g after-select-pane 'run-shell -b "#{@local_status_controller}"'
set-hook -g after-select-window 'run-shell -b "#{@local_status_controller}"'
set-hook -g after-new-window 'run-shell -b "#{@local_status_controller}"'
set-hook -g after-split-window 'run-shell -b "#{@local_status_controller}"'
set-hook -g pane-exited 'run-shell -b "#{@local_status_controller}"'

# 内联 watcher：主要用于捕捉本地 nvim/vim、ssh 进程启动/退出等 tmux hook 看不到的变化。
run-shell -b 'T="$(command -v tmux || { [ -x /opt/homebrew/bin/tmux ] && printf %s /opt/homebrew/bin/tmux; } || { [ -x /usr/local/bin/tmux ] && printf %s /usr/local/bin/tmux; } || { [ -x /usr/bin/tmux ] && printf %s /usr/bin/tmux; })"; [ -n "$T" ] || exit 0; old="$($T show -gv @local_status_watcher_pid 2>/dev/null || true)"; [ -n "$old" ] && kill "$old" 2>/dev/null || true; old2="$($T show -gv @local_ssh_status_watcher_pid 2>/dev/null || true)"; [ -n "$old2" ] && kill "$old2" 2>/dev/null || true; ctrl="$($T show -gv @local_status_controller 2>/dev/null || true)"; [ -n "$ctrl" ] && $T run-shell -b "$ctrl"; ( while "$T" has-session 2>/dev/null; do ctrl="$($T show -gv @local_status_controller 2>/dev/null || true)"; [ -n "$ctrl" ] && "$T" run-shell -b "$ctrl"; sleep 1; done ) & $T set -g @local_status_watcher_pid "$!"; $T set -gu @local_ssh_status_watcher_pid 2>/dev/null || true'

# ---------- 插件 ----------
set -g @plugin 'tmux-plugins/tpm'

# 必备
set -g @plugin 'tmux-plugins/tmux-sensible'

# 状态栏增强
# set -g @plugin 'tmux-plugins/tmux-powerline'
# 或（推荐更现代）
#set -g @plugin 'catppuccin/tmux'

# 自动恢复 session
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 快速 yank 到系统剪贴板
set -g @plugin 'tmux-plugins/tmux-yank'

# ---------- resurrect 配置 ----------
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# ---------- 初始化 TPM ----------
run '~/.config/tmux/plugins/tpm/tpm'
