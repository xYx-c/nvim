# ---------- 基础 ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -g mouse on
set -g xterm-keys on
set -g set-clipboard on

unbind -n WheelUpPane
unbind -n WheelDownPane

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set -g history-limit 100000
set -g focus-events on

# 更快响应
set -sg escape-time 0

# ---------- 前缀键 ----------
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# ---------- 分屏 ----------
bind | split-window -h
bind - split-window -v


# 使用 vim 键位移动
bind j select-pane -D
bind h select-pane -L
bind k select-pane -U
bind l select-pane -R

# 调整 pane 大小
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# ---------- 窗口 ----------
set -g base-index 1
set -g pane-base-index 1
bind c new-window
bind n next-window
bind p previous-window
# bind x kill-pane
# bind & kill-window

# Use Alt + number to switch windows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------- 复制模式 ----------
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle


# ---------- 状态栏 ----------
set -g status-position bottom
set -g status-interval 1
# ===== 基础状态栏 =====
set -g status-style bg=#ebdbb2,fg=#3c3836
# ===== 左侧（session）=====
set -g status-left-length 40
set -g status-left "#[fg=#fbf1c7,bg=#d79921,bold] #S #[fg=#d79921,bg=#f2e5bc,nobold]"
# ===== 右侧（时间）=====
set -g status-right-length 50
set -g status-right "#[fg=#fbf1c7,bg=#458588] %Y-%m-%d %H:%M #[fg=#458588,bg=#f2e5bc]#(/opt/homebrew/bin/tmux if-shell -F '#{E:@local_hide_status_format}' 'set-option -q status off' 'set-option -q status on' \; if-shell -F '#{E:@local_is_ssh_format}' 'set-window-option -q pane-border-status top' 'set-window-option -q pane-border-status off' >/dev/null 2>&1)"
# ===== 窗口标签 =====
# 普通窗口
set -g window-status-format "#[fg=#7c6f64,bg=#ebdbb2] #I:#W #[default]"
# 当前窗口
set -g window-status-current-format "#[fg=#fbf1c7,bg=#b16286,bold] #I:#W #[fg=#b16286,bg=#f2e5bc,nobold]"
# ===== 分隔线 =====
set -g window-status-separator ""
# ===== Pane 边框 =====
set -g pane-border-style fg=#d5c4a1
set -g pane-active-border-style fg=#b16286
set -g pane-border-format "#[fg=#7c6f64,bg=default] #{window_index}:#{pane_current_command} #[default]"
set -g pane-border-status off
# ===== 消息提示 =====
set -g message-style bg=#ebdbb2,fg=#3c3836
# ===== 命令行 =====
set -g message-command-style bg=#d79921,fg=#fbf1c7

# ---------- SSH / 嵌套 tmux 状态栏 ----------
# 目标：普通 ssh 显示顶部轻量标识；ssh 内检测到远程 tmux 时隐藏本地底部状态栏。
# 说明：不依赖远程 tmux.conf，也不写外部脚本。内嵌 watcher 每秒抓取当前 ssh pane 底部几行，
# 用常见状态栏特征启发式判断远程 tmux 是否存在。
set -g @local_remote_tmux_active 0
set -g @local_is_ssh_format '#{||:#{==:#{pane_current_command},ssh},#{==:#{pane_current_command},mosh}}'
set -g @local_is_remote_tmux_format '#{&&:#{E:@local_is_ssh_format},#{==:#{@local_remote_tmux_active},1}}'
set -g @local_hide_status_format '#{||:#{==:#{@nvim_lualine},1},#{||:#{==:#{pane_current_command},nvim},#{||:#{==:#{pane_current_command},vim},#{E:@local_is_remote_tmux_format}}}}'
set -g @local_refresh_ssh_status 'if-shell -F "#{E:@local_hide_status_format}" "set-option -q status off" "set-option -q status on" ; if-shell -F "#{E:@local_is_ssh_format}" "set-window-option -q pane-border-status top" "set-window-option -q pane-border-status off"'

# 顶部 SSH 标识：一条轻量线，展示本地 session/window/pane 与 pane 标题。
set -g pane-border-format '#[fg=#928374]ssh #[nobold,fg=#928374] #S:#I#[default]'

# 远程 tmux 状态栏启发式匹配。单独放到选项里，避免 watcher 主体过长，后续也容易补规则。
set -g @local_remote_tmux_regex '(^|[[:space:]])\[[^]]+\][[:space:]]+[0-9]+:[^[:space:]]+|(^|[[:space:]])[0-9]+:[^[:space:]]+.*([0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2}:[0-9]{2})|[[:space:]]voice[[:space:]]+(on|off)[[:space:]]+.*[0-9]+[[:space:]]+session|[[:space:]]coder[[:space:]]+❯'

set-hook -g client-attached '#{E:@local_refresh_ssh_status}'
set-hook -g client-session-changed '#{E:@local_refresh_ssh_status}'
set-hook -g pane-focus-in '#{E:@local_refresh_ssh_status}'
set-hook -g pane-focus-out '#{E:@local_refresh_ssh_status}'
set-hook -g pane-title-changed '#{E:@local_refresh_ssh_status}'
set-hook -g window-pane-changed '#{E:@local_refresh_ssh_status}'
set-hook -g after-select-pane '#{E:@local_refresh_ssh_status}'
set-hook -g after-select-window '#{E:@local_refresh_ssh_status}'
set-hook -g after-new-window '#{E:@local_refresh_ssh_status}'
set-hook -g after-split-window '#{E:@local_refresh_ssh_status}'
set-hook -g pane-exited '#{E:@local_refresh_ssh_status}'

# 内嵌 watcher：优先使用 PATH 中的 tmux；PATH 不完整时兼容 Homebrew/系统常见路径。reload 时替换旧 watcher。
run-shell -b 'T="$(command -v tmux || { [ -x /opt/homebrew/bin/tmux ] && printf %s /opt/homebrew/bin/tmux; } || { [ -x /usr/local/bin/tmux ] && printf %s /usr/local/bin/tmux; } || { [ -x /usr/bin/tmux ] && printf %s /usr/bin/tmux; })"; [ -z "$T" ] && exit 0; old="$($T show -gv @local_ssh_status_watcher_pid 2>/dev/null)"; [ -n "$old" ] && kill "$old" 2>/dev/null; ( while $T has-session 2>/dev/null; do pane="$($T display-message -p "##{pane_id}" 2>/dev/null)"; remote=0; if [ -n "$pane" ]; then cmd="$($T display-message -p -t "$pane" "##{pane_current_command}" 2>/dev/null)"; if [ "$cmd" = ssh ] || [ "$cmd" = mosh ]; then text="$($T capture-pane -t "$pane" -p -S -10 2>/dev/null | tail -n 10)"; re="$($T show -gv @local_remote_tmux_regex 2>/dev/null)"; printf "%s\n" "$text" | grep -E "$re" >/dev/null 2>&1 && remote=1; fi; fi; $T set -g @local_remote_tmux_active "$remote" 2>/dev/null; $T if-shell -F "##{E:@local_hide_status_format}" "set-option -q status off" "set-option -q status on" 2>/dev/null; $T if-shell -F "##{E:@local_is_ssh_format}" "set-window-option -q pane-border-status top" "set-window-option -q pane-border-status off" 2>/dev/null; sleep 1; done ) & $T set -g @local_ssh_status_watcher_pid "$!"'

# ---------- 插件 ----------
set -g @plugin 'tmux-plugins/tpm'

# 必备
set -g @plugin 'tmux-plugins/tmux-sensible'

# 状态栏增强
# set -g @plugin 'tmux-plugins/tmux-powerline'
# 或（推荐更现代）
#set -g @plugin 'catppuccin/tmux'

# 自动恢复 session
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 快速 yank 到系统剪贴板
set -g @plugin 'tmux-plugins/tmux-yank'

# ---------- resurrect 配置 ----------
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# ---------- 初始化 TPM ----------
run '~/.config/tmux/plugins/tpm/tpm'
